name: Build Ghost Lag Hex APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract & Fix Timestamps
      run: |
        set -e
        if [ -f "settings.gradle" ]; then
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        else
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "No ZIP found"; exit 1; fi
          mkdir -p extracted
          unzip -q -DD "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        fi
        
        cd $PROJECT_DIR
        
        # 1. Saara kachra delete karo
        rm -rf app/.cxx app/build build .gradle || true
        
        # 2. Timestamps fix karo
        find . -exec touch -t 202001010000 {} +
        
        # 3. Windows/AIDE ke CRLF fix karo
        find . -type f -exec sed -i 's/\r$//' {} +

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Forcefully Gradle 8.2 use karo
    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Setup Android SDK & NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Build APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        gradle assembleDebug --no-daemon --no-build-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ghost-Lag-Hex-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
