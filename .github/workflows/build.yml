name: Build Hex APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Yahan hum ZIP ko unzip kar rahe hain
    - name: Unzip Source Code
      run: |
        # Apni zip file ka naam yahan daalo (agar alag hai toh)
        unzip -q HexNonRooted.zip 
        
        # Agar zip ke andar ek folder ban gaya hai, toh uski files ko root me le aao
        if [ -d "HexNonRooted" ]; then mv HexNonRooted/* .; fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hex-Non-Rooted-APK
        path: app/build/outputs/apk/debug/app-debug.apk
