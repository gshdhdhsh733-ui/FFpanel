
name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          cp -r /tmp/android-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDK" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDK" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          unzip -o .github/workflows/panel.zip -d project

          if [ -f project/app/build.gradle ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          elif [ -f project/app/app/build.gradle ]; then
            echo "PROJECT_DIR=project/app" >> "$GITHUB_ENV"
          else
            echo "ERROR: Gradle project not found"
            exit 1
          fi

      - name: Clean Old Native Build
        run: |
          rm -rf "$PROJECT_DIR/app/build"
          rm -rf "$PROJECT_DIR/app/.cxx"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Panel-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
