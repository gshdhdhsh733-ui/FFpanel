name: Build Ghost Lag Hex APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Find Project Files
      run: |
        set -e
        
        # Check karo agar project direct root me hai (bina zip ke)
        if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
          echo "Project files direct mil gayi hain. Koi ZIP ki zaroorat nahi."
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        else
          # Agar direct nahi hai, toh poore repo me ZIP dhoondho
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Na toh ZIP mili aur na hi direct project files!"
            exit 1
          fi
          echo "ZIP mil gayi: $ZIP_FILE"
          
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          
          # ZIP ke andar settings.gradle dhoondho
          SETTINGS=$(find extracted -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: ZIP ke andar settings.gradle nahi mila!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK & NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Build APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        chmod +x gradlew || true
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ghost-Lag-Hex-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
