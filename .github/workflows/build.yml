name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Extract Project and Fix Folder
      run: |
        unzip panel.zip
        if [ -d "panel" ]; then cp -r panel/* .; fi
    - name: Download Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-6.5-bin.zip
        unzip gradle-6.5-bin.zip
    - name: Build with Gradle
      run: ./gradle-6.5/bin/gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Pro-Mode-Root-APK
        path: app/build/outputs/apk/debug/app-debug.apk
