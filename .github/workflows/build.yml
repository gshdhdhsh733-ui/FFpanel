name: Build Ghost Lag Hex APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        # Jo bhi zip file hai root me, use unzip karo
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "ERROR: Koi ZIP file nahi mili!"
          exit 1
        fi
        echo "Found ZIP: $ZIP_FILE"
        unzip -q "$ZIP_FILE" -d extracted

        # Project root dhoondho (jahan settings.gradle ho)
        SETTINGS=$(find extracted -name "settings.gradle" | head -n 1)
        if [ -z "$SETTINGS" ]; then
          echo "ERROR: settings.gradle nahi mila!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$SETTINGS")
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK & NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Build APK
      run: |
        cd $PROJECT_DIR
        chmod +x gradlew || true
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ghost-Lag-Hex-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
