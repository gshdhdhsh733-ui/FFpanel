name: Build Hex Non Rooted APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-cli
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R /tmp/android-cli/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          
          # ZIP file dhoondhna
          OUTER=$(find . -name "*.zip" | head -n 1)
          if [ -z "$OUTER" ]; then
            echo "ERROR: Koi bhi ZIP file nahi mili!"
            exit 1
          fi
          echo "Mil gayi ZIP file: $OUTER"

          rm -rf project
          mkdir -p project
          unzip -q -o "$OUTER" -d project

          # settings.gradle dhoondhna
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found in ZIP."
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Clean old build outputs
        run: |
          rm -rf "$PROJECT_DIR/app/build" "$PROJECT_DIR/app/.cxx"

      - name: Fix AndroidX and Build APK
        run: |
          cd "$PROJECT_DIR"
          # Yeh AndroidX wala error fix karega
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # APK Build command
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hex-Non-Rooted-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
