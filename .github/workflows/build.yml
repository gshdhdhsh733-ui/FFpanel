name: Build Ghost Lag Hex APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract & Fix Timestamps
      run: |
        set -e
        if [ -f "settings.gradle" ]; then
          echo "PROJECT_DIR=." >> $GITHUB_ENV
        else
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "No ZIP found"; exit 1; fi
          mkdir -p extracted
          unzip -q -DD "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        fi
        
        cd $PROJECT_DIR
        
        # 1. Purana cache aur build folder delete karo
        rm -rf app/.cxx app/build build .gradle || true
        
        # 2. Saari files ka time fix karo (Infinite loop rokne ke liye)
        find . -exec touch -t 202001010000 {} +
        
        # 3. CRLF (Windows Enter) fix karo
        find . -type f -exec sed -i 's/\r$//' {} +

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK & NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Build APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        chmod +x gradlew || true
        ./gradlew assembleDebug --no-daemon --no-build-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ghost-Lag-Hex-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
