name: Build Hex APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip Source Code
      run: |
        # Zip file ko dhoondhna aur unzip karna
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: Koi ZIP file nahi mili!"
          exit 1
        fi
        echo "Found ZIP: $ZIP_FILE"
        unzip -q "$ZIP_FILE" -d extracted_project

    - name: Build with Gradle
      run: |
        # Project ka root folder dhoondhna (jahan settings.gradle ho)
        PROJECT_DIR=$(find extracted_project -name "settings.gradle" -exec dirname {} \; | head -n 1)
        echo "Project found at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hex-Non-Rooted-APK
        path: extracted_project/**/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
