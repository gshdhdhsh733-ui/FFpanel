name: Build Hex Non Rooted APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Install Android SDK & NDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-cli
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R /tmp/android-cli/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail
          
          # 1. ZIP file dhoondhna (Jahan bhi ho)
          OUTER=$(find . -name "*.zip" | head -n 1)
          if [ -z "$OUTER" ]; then
            echo "ERROR: Koi bhi ZIP file nahi mili!"
            exit 1
          fi
          echo "Mil gayi ZIP file: $OUTER"

          # 2. Unzip karna
          rm -rf project
          mkdir -p project
          unzip -q -o "$OUTER" -d project

          # 3. Root folder dhoondhna (jahan settings.gradle ho)
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle nahi mili ZIP ke andar."
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project root detected at: $ROOT"

      - name: Force Fix Gradle Properties
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          # AIDE ki purani galtiyan mitane ke liye hum nayi file bana rahe hain
          rm -f gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties

      - name: Clean and Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          # Gradle ko force karna ki wo local wrapper chhode aur global gradle use kare
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hex-Non-Rooted-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
