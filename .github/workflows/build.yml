
name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o .github/workflows/panel.zip -d project

          if [ -f project/app/build.gradle ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          elif [ -f project/app/app/build.gradle ]; then
            echo "PROJECT_DIR=project/app" >> "$GITHUB_ENV"
          else
            echo "Project Gradle files not found"
            find project -maxdepth 4 -type f
            exit 1
          fi

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Panel-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
