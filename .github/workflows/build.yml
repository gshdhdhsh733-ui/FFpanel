name: Android Build

on:
  name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-cli
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R /tmp/android-cli/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Extract nested project ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUTER=".github/workflows/panel.zip"
          test -f "$OUTER" || { echo "Missing $OUTER"; exit 1; }

          rm -rf wrapper project
          mkdir -p wrapper project
          unzip -q -o "$OUTER" -d wrapper

          INNER="$(find wrapper -type f -name 'panel.zip' -print -quit)"
          if [ -n "$INNER" ]; then
            echo "Nested ZIP found: $INNER"
            unzip -q -o "$INNER" -d project
          else
            echo "No nested ZIP; checking extracted contents directly"
            cp -a wrapper/. project/
          fi

          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found. ZIP contents:"
            find project -maxdepth 6 -type f | sort | head -200
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"
          if [ ! -f "$ROOT/app/build.gradle" ] && [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle(.kts) not found under $ROOT"
            find "$ROOT" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Detected project: $ROOT"

      # YEH NAYA STEP HAI: Timestamp fix aur deep clean
      - name: Clean old build outputs and fix timestamps
        run: |
          rm -rf "$PROJECT_DIR/app/build" "$PROJECT_DIR/app/.cxx"
          # ZIP extraction ke future timestamps ko reset kar rahe hain
          find "$PROJECT_DIR" -exec touch {} +

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Panel-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
